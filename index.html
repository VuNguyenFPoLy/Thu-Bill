<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý thu cước</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; font-family: -apple-system, Roboto, sans-serif; }
  body { margin: 0; padding: 0; background: #f4f6f8; }
  #app { display: none; }
  #login { padding: 40px 20px; max-width: 400px; margin: auto; }
  #login h2 { text-align: center; }
  #login input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
  #login button { width: 100%; padding: 12px; background: #1976d2; color: #fff; border: none; border-radius: 8px; font-size: 16px; }
  header { background: #1976d2; color: #fff; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
  header button { background: #fff; color: #1976d2; border: none; padding: 6px 12px; border-radius: 6px; }
  #map { height: 45vh; width: 100%; }
  .tabs { display: flex; background: #fff; border-bottom: 1px solid #ddd; }
  .tabs button { flex: 1; padding: 12px; border: none; background: none; font-size: 14px; }
  .tabs button.active { border-bottom: 3px solid #1976d2; color: #1976d2; font-weight: bold; }
  .tab-content { display: none; padding: 12px; }
  .tab-content.active { display: block; }
  .card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .card h4 { margin: 0 0 6px; }
  .card small { color: #666; }
  .form-group { margin-bottom: 10px; }
  .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: #555; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
  .btn { padding: 10px 16px; border: none; border-radius: 6px; background: #1976d2; color: #fff; font-size: 15px; }
  .btn.gray { background: #888; }
  .btn.red { background: #e53935; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; color: #fff; font-size: 11px; }
  .list-actions { display: flex; gap: 6px; margin-top: 8px; }
  .list-actions button { flex: 1; padding: 6px; font-size: 13px; border: none; border-radius: 5px; }
  .section-title { font-weight: bold; margin: 14px 0 8px; color: #333; }
  .hidden { display: none; }
</style>
</head>
<body>

<!-- ĐĂNG NHẬP -->
<div id="login">
  <h2>🔐 Đăng nhập</h2>
  <input id="loginUser" placeholder="Tên đăng nhập" autocomplete="username">
  <input id="loginPass" type="password" placeholder="Mật khẩu" autocomplete="current-password">
  <button onclick="doLogin()">Vào hệ thống</button>
  <p style="font-size:12px;color:#888;text-align:center;margin-top:16px">
    Lần đầu: đăng nhập bằng <b>admin / 123456</b> rồi đổi trong Cài đặt.
  </p>
</div>

<!-- ỨNG DỤNG CHÍNH -->
<div id="app">
  <header>
    <strong>📶 Thu cước</strong>
    <button onclick="logout()">Đăng xuất</button>
  </header>

  <div id="map"></div>

  <div class="tabs">
    <button class="active" onclick="switchTab('customers', this)">Khách hàng</button>
    <button onclick="switchTab('points', this)">Tập điểm</button>
    <button onclick="switchTab('packages', this)">Gói cước</button>
    <button onclick="switchTab('settings', this)">Cài đặt</button>
  </div>

  <!-- TAB KHÁCH HÀNG -->
  <div id="tab-customers" class="tab-content active">
    <div class="legend">
      <span><i class="dot" style="background:#2979ff"></i> Vừa đóng</span>
      <span><i class="dot" style="background:#43a047"></i> Có thể thu</span>
      <span><i class="dot" style="background:#fdd835"></i> Sắp quá hạn</span>
      <span><i class="dot" style="background:#e53935"></i> Quá hạn</span>
      <span><i class="dot" style="background:#fb8c00"></i> Huỷ / không thu</span>
    </div>

    <div class="card">
      <div class="section-title">➕ Thêm khách hàng</div>
      <div class="form-group"><label>Tên khách hàng</label><input id="cName"></div>
      <div class="form-group"><label>Số điện thoại</label><input id="cPhone" type="tel"></div>
      <div class="form-group"><label>Gói cước</label><select id="cPackage"></select></div>
      <div class="form-group"><label>Tập điểm</label><select id="cPoint"></select></div>
      <div class="form-group">
        <label>Toạ độ (vĩ độ, kinh độ)</label>
        <div style="display:flex;gap:6px">
          <input id="cLat" placeholder="Vĩ độ (lat)" style="flex:1">
          <input id="cLng" placeholder="Kinh độ (lng)" style="flex:1">
        </div>
        <button class="btn gray" style="margin-top:6px;width:100%" onclick="getMyLocation()">📍 Lấy vị trí hiện tại</button>
      </div>
      <div class="form-group"><label>Ngày cần thu bill</label><input id="cBillDate" type="date"></div>
      <div class="form-group"><label>Trạng thái</label>
        <select id="cStatus">
          <option value="pending">Chưa thu</option>
          <option value="paid">Đã đóng</option>
          <option value="cancelled">Huỷ / không thu được</option>
        </select>
      </div>
      <button class="btn" style="width:100%" onclick="addCustomer()">Lưu khách hàng</button>
    </div>

    <div class="section-title">📋 Danh sách khách hàng</div>
    <div id="customerList"></div>
  </div>

  <!-- TAB TẬP ĐIỂM -->
  <div id="tab-points" class="tab-content">
    <div class="card">
      <div class="section-title">➕ Thêm tập điểm</div>
      <div class="form-group"><label>Tên tập điểm</label><input id="pName" placeholder="VD: Chung cư A, hẻm 5..."></div>
      <div class="form-group">
        <label>Toạ độ</label>
        <div style="display:flex;gap:6px">
          <input id="pLat" placeholder="Vĩ độ" style="flex:1">
          <input id="pLng" placeholder="Kinh độ" style="flex:1">
        </div>
        <button class="btn gray" style="margin-top:6px;width:100%" onclick="getMyLocationPoint()">📍 Lấy vị trí hiện tại</button>
      </div>
      <div class="form-group"><label>Hình ảnh</label><input id="pImage" type="file" accept="image/*" capture="environment"></div>
      <button class="btn" style="width:100%" onclick="addPoint()">Lưu tập điểm</button>
    </div>

    <div class="section-title">📌 Danh sách tập điểm</div>
    <div id="pointList"></div>
  </div>

  <!-- TAB GÓI CƯỚC -->
  <div id="tab-packages" class="tab-content">
    <div class="card">
      <div class="section-title">➕ Thêm gói cước</div>
      <div class="form-group"><label>Tên gói</label><input id="pkgName" placeholder="VD: Internet 150Mbps"></div>
      <div class="form-group"><label>Giá tiền (VNĐ)</label><input id="pkgPrice" type="number"></div>
      <button class="btn" style="width:100%" onclick="addPackage()">Lưu gói cước</button>
    </div>
    <div class="section-title">💰 Danh sách gói cước</div>
    <div id="packageList"></div>
  </div>

  <!-- TAB CÀI ĐẶT -->
  <div id="tab-settings" class="tab-content">
    <div class="card">
      <div class="section-title">🔐 Đổi mật khẩu</div>
      <div class="form-group"><label>Tên đăng nhập mới</label><input id="setUser"></div>
      <div class="form-group"><label>Mật khẩu mới</label><input id="setPass" type="password"></div>
      <button class="btn" onclick="savePassword()">Lưu</button>
    </div>
    <div class="card">
      <div class="section-title">💾 Dữ liệu</div>
      <button class="btn gray" style="width:100%;margin-bottom:8px" onclick="exportData()">📤 Xuất dữ liệu (backup)</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn gray" style="width:100%;margin-bottom:8px" onclick="document.getElementById('importFile').click()">📥 Nhập dữ liệu</button>
      <button class="btn red" style="width:100%" onclick="resetAll()">🗑 Xoá toàn bộ dữ liệu</button>
    </div>
  </div>
</div>

<script>
// ==================== QUẢN LÝ TÀI KHOẢN ====================
const AUTH_KEY = 'auth_v1';
function getAuth() {
  let a = localStorage.getItem(AUTH_KEY);
  if (!a) {
    a = JSON.stringify({user:'admin', pass:'123456'});
    localStorage.setItem(AUTH_KEY, a);
  }
  return JSON.parse(a);
}
function doLogin() {
  const a = getAuth();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (u === a.user && p === a.pass) {
    localStorage.setItem('logged', '1');
    showApp();
  } else alert('Sai tài khoản hoặc mật khẩu!');
}
function logout() {
  localStorage.removeItem('logged');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'block';
}
function savePassword() {
  const u = document.getElementById('setUser').value.trim();
  const p = document.getElementById('setPass').value;
  if (!u || !p) return alert('Nhập đủ thông tin');
  localStorage.setItem(AUTH_KEY, JSON.stringify({user:u, pass:p}));
  alert('Đã đổi. Hãy đăng nhập lại.');
  logout();
}

// ==================== DỮ LIỆU ====================
const DB = {
  customers: 'db_customers',
  points: 'db_points',
  packages: 'db_packages'
};
function load(key, def=[]) {
  try { return JSON.parse(localStorage.getItem(key)) || def; }
  catch { return def; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

// ==================== BẢN ĐỒ ====================
let map, markersLayer;
function initMap() {
  map = L.map('map').setView([10.7769, 106.7009], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

// ==================== MÀU THEO TRẠNG THÁI ====================
function getColor(c) {
  if (c.status === 'cancelled') return '#fb8c00';
  if (c.status === 'paid') return '#2979ff';
  if (!c.billDate) return '#9e9e9e';
  const today = new Date(); today.setHours(0,0,0,0);
  const bill = new Date(c.billDate); bill.setHours(0,0,0,0);
  const diff = Math.floor((bill - today) / (1000*60*60*24)); // >0 còn ngày, <0 quá hạn
  if (diff < 0) return '#e53935';      // quá hạn -> đỏ
  if (diff <= 5) return '#fdd835';     // còn <=5 ngày -> vàng
  if (diff <= 10) return '#43a047';    // còn <=10 ngày -> xanh lá
  return '#43a047';                     // còn xa -> xanh lá (có thể thu)
}

// ==================== RENDER ====================
function refreshAll() {
  renderCustomerOptions();
  renderCustomers();
  renderPoints();
  renderPackages();
  renderMap();
}

function renderCustomerOptions() {
  const packages = load(DB.packages);
  const points = load(DB.points);
  const cPackage = document.getElementById('cPackage');
  const cPoint = document.getElementById('cPoint');
  cPackage.innerHTML = '<option value="">-- Chọn gói --</option>' +
    packages.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  cPoint.innerHTML = '<option value="">-- Không thuộc tập điểm --</option>' +
    points.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
}

function statusLabel(c) {
  if (c.status === 'cancelled') return '<span class="badge" style="background:#fb8c00">Huỷ</span>';
  if (c.status === 'paid') return '<span class="badge" style="background:#2979ff">Đã đóng</span>';
  const today = new Date(); today.setHours(0,0,0,0);
  const bill = new Date(c.billDate); bill.setHours(0,0,0,0);
  const diff = Math.floor((bill - today) / (1000*60*60*24));
  if (diff < 0) return `<span class="badge" style="background:#e53935">Quá hạn ${-diff} ngày</span>`;
  if (diff <= 5) return `<span class="badge" style="background:#fdd835;color:#000">Còn ${diff} ngày</span>`;
  return `<span class="badge" style="background:#43a047">Còn ${diff} ngày</span>`;
}

function renderCustomers() {
  const list = load(DB.customers);
  const packages = load(DB.packages);
  const points = load(DB.points);
  const el = document.getElementById('customerList');
  if (!list.length) { el.innerHTML = '<div class="card"><small>Chưa có khách hàng.</small></div>'; return; }
  // Sắp xếp theo ngày bill tăng dần
  const sorted = [...list].sort((a,b) => (a.billDate||'').localeCompare(b.billDate||''));
  el.innerHTML = sorted.map(c => {
    const pkg = packages.find(p => p.id === c.packageId);
    const pt = points.find(p => p.id === c.pointId);
    return `<div class="card">
      <h4>${c.name} ${statusLabel(c)}</h4>
      <small>📞 ${c.phone || '-'}<br>
      📦 ${pkg ? pkg.name : '-'}<br>
      📍 ${pt ? pt.name : '-'}<br>
      📅 ${c.billDate || '-'}</small>
      <div class="list-actions">
        <button class="btn" style="background:#2979ff" onclick="markPaid('${c.id}')">Đã đóng</button>
        <button class="btn" style="background:#fb8c00" onclick="markCancel('${c.id}')">Huỷ</button>
        <button class="btn red" onclick="deleteCustomer('${c.id}')">Xoá</button>
      </div>
    </div>`;
  }).join('');
}

function renderPoints() {
  const list = load(DB.points);
  const customers = load(DB.customers);
  const el = document.getElementById('pointList');
  if (!list.length) { el.innerHTML = '<div class="card"><small>Chưa có tập điểm.</small></div>'; return; }
  el.innerHTML = list.map(p => {
    const count = customers.filter(c => c.pointId === p.id).length;
    return `<div class="card">
      <h4>📌 ${p.name}</h4>
      <small>Toạ độ: ${p.lat}, ${p.lng}<br>Số KH: ${count}</small>
      ${p.image ? `<div style="margin-top:8px"><img src="${p.image}" style="max-width:100%;border-radius:6px"></div>` : ''}
      <div class="list-actions">
        <button class="btn" style="background:#43a047" onclick="viewPointCustomers('${p.id}')">Xem KH</button>
        <button class="btn red" onclick="deletePoint('${p.id}')">Xoá</button>
      </div>
    </div>`;
  }).join('');
}

function renderPackages() {
  const list = load(DB.packages);
  const el = document.getElementById('packageList');
  if (!list.length) { el.innerHTML = '<div class="card"><small>Chưa có gói cước.</small></div>'; return; }
  el.innerHTML = list.map(p => `<div class="card">
    <h4>📦 ${p.name}</h4>
    <small>${p.price ? Number(p.price).toLocaleString('vi-VN') + ' đ' : 'Chưa đặt giá'}</small>
    <div class="list-actions">
      <button class="btn red" onclick="deletePackage('${p.id}')">Xoá</button>
    </div>
  </div>`).join('');
}

function renderMap() {
  if (!markersLayer) return;
  markersLayer.clearLayers();
  const customers = load(DB.customers);
  const points = load(DB.points);

  // Vẽ tập điểm (icon khác)
  points.forEach(p => {
    const icon = L.divIcon({
      html: `<div style="background:#6a1b9a;color:#fff;border-radius:50%;width:28px;height:28px;text-align:center;line-height:28px;font-size:14px;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.4)">📌</div>`,
      className: '', iconSize: [28,28]
    });
    const m = L.marker([p.lat, p.lng], {icon}).addTo(markersLayer);
    const list = customers.filter(c => c.pointId === p.id);
    m.bindPopup(`<b>${p.name}</b><br>${list.length} khách hàng`);
  });

  // Vẽ khách hàng
  customers.forEach(c => {
    if (!c.lat || !c.lng) return;
    const color = getColor(c);
    const icon = L.divIcon({
      html: `<div style="background:${color};width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5)"></div>`,
      className: '', iconSize: [18,18]
    });
    const m = L.marker([c.lat, c.lng], {icon}).addTo(markersLayer);
    m.bindPopup(`<b>${c.name}</b><br>📞 ${c.phone||'-'}<br>📅 ${c.billDate||'-'}`);
  });
}

// ==================== HÀNH ĐỘNG ====================
function addCustomer() {
  const name = document.getElementById('cName').value.trim();
  const phone = document.getElementById('cPhone').value.trim();
  const packageId = document.getElementById('cPackage').value;
  const pointId = document.getElementById('cPoint').value;
  const lat = parseFloat(document.getElementById('cLat').value);
  const lng = parseFloat(document.getElementById('cLng').value);
  const billDate = document.getElementById('cBillDate').value;
  const status = document.getElementById('cStatus').value;
  if (!name) return alert('Nhập tên khách hàng');
  if (!lat || !lng) return alert('Nhập hoặc lấy toạ độ');
  const list = load(DB.customers);
  list.push({
    id: 'c_' + Date.now(),
    name, phone, packageId, pointId, lat, lng, billDate, status
  });
  save(DB.customers, list);
  document.getElementById('cName').value = '';
  document.getElementById('cPhone').value = '';
  document.getElementById('cLat').value = '';
  document.getElementById('cLng').value = '';
  document.getElementById('cBillDate').value = '';
  refreshAll();
}

function markPaid(id) {
  const list = load(DB.customers);
  const c = list.find(x => x.id === id);
  if (c) { c.status = 'paid'; save(DB.customers, list); refreshAll(); }
}
function markCancel(id) {
  const list = load(DB.customers);
  const c = list.find(x => x.id === id);
  if (c) { c.status = 'cancelled'; save(DB.customers, list); refreshAll(); }
}
function deleteCustomer(id) {
  if (!confirm('Xoá khách hàng này?')) return;
  save(DB.customers, load(DB.customers).filter(c => c.id !== id));
  refreshAll();
}

function addPoint() {
  const name = document.getElementById('pName').value.trim();
  const lat = parseFloat(document.getElementById('pLat').value);
  const lng = parseFloat(document.getElementById('pLng').value);
  const file = document.getElementById('pImage').files[0];
  if (!name || !lat || !lng) return alert('Nhập tên và toạ độ');
  const finish = (imgData) => {
    const list = load(DB.points);
    list.push({ id:'p_'+Date.now(), name, lat, lng, image: imgData || '' });
    save(DB.points, list);
    document.getElementById('pName').value = '';
    document.getElementById('pLat').value = '';
    document.getElementById('pLng').value = '';
    document.getElementById('pImage').value = '';
    refreshAll();
  };
  if (file) {
    const reader = new FileReader();
    reader.onload = e => finish(e.target.result);
    reader.readAsDataURL(file);
  } else finish('');
}
function deletePoint(id) {
  if (!confirm('Xoá tập điểm?')) return;
  save(DB.points, load(DB.points).filter(p => p.id !== id));
  refreshAll();
}
function viewPointCustomers(id) {
  const customers = load(DB.customers).filter(c => c.pointId === id);
  const p = load(DB.points).find(x => x.id === id);
  alert((p ? p.name + '\n\n' : '') + (customers.length ? customers.map(c => '• ' + c.name + ' - ' + c.phone).join('\n') : 'Chưa có khách hàng.'));
}

function addPackage() {
  const name = document.getElementById('pkgName').value.trim();
  const price = parseFloat(document.getElementById('pkgPrice').value) || 0;
  if (!name) return alert('Nhập tên gói');
  const list = load(DB.packages);
  list.push({ id:'pk_'+Date.now(), name, price });
  save(DB.packages, list);
  document.getElementById('pkgName').value = '';
  document.getElementById('pkgPrice').value = '';
  refreshAll();
}
function deletePackage(id) {
  if (!confirm('Xoá gói cước?')) return;
  save(DB.packages, load(DB.packages).filter(p => p.id !== id));
  refreshAll();
}

// ==================== LẤY VỊ TRÍ ====================
function getMyLocation() {
  if (!navigator.geolocation) return alert('Trình duyệt không hỗ trợ GPS');
  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById('cLat').value = pos.coords.latitude.toFixed(6);
      document.getElementById('cLng').value = pos.coords.longitude.toFixed(6);
      alert('Đã lấy toạ độ');
    },
    err => alert('Không lấy được vị trí: ' + err.message),
    { enableHighAccuracy: true, timeout: 15000 }
  );
}
function getMyLocationPoint() {
  if (!navigator.geolocation) return alert('Không hỗ trợ GPS');
  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById('pLat').value = pos.coords.latitude.toFixed(6);
      document.getElementById('pLng').value = pos.coords.longitude.toFixed(6);
    },
    err => alert('Lỗi: ' + err.message),
    { enableHighAccuracy: true, timeout: 15000 }
  );
}

// ==================== IMPORT / EXPORT ====================
function exportData() {
  const data = {
    customers: load(DB.customers),
    points: load(DB.points),
    packages: load(DB.packages)
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'backup_thuoc_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}
function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.customers) save(DB.customers, data.customers);
      if (data.points) save(DB.points, data.points);
      if (data.packages) save(DB.packages, data.packages);
      refreshAll();
      alert('Đã nhập dữ liệu');
    } catch { alert('File không hợp lệ'); }
  };
  reader.readAsText(file);
}
function resetAll() {
  if (!confirm('XOÁ TOÀN BỘ dữ liệu khách hàng, tập điểm, gói cước?')) return;
  localStorage.removeItem(DB.customers);
  localStorage.removeItem(DB.points);
  localStorage.removeItem(DB.packages);
  refreshAll();
}

// ==================== TAB / KHỞI TẠO ====================
function switchTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
  setTimeout(() => map && map.invalidateSize(), 100);
}

function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  if (!map) initMap();
  setTimeout(() => map.invalidateSize(), 200);
  refreshAll();
}

// ==================== KHỞI CHẠY ====================
window.onload = () => {
  if (localStorage.getItem('logged') === '1') showApp();
};
</script>
